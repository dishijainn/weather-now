<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen font-sans">
  <h1 class="text-3xl font-bold mb-4">🌦️ Weather App</h1>
  
  <div class="bg-white p-6 rounded-2xl shadow-md w-80 text-center">
    <input type="text" id="cityInput" placeholder="Enter city name" class="border p-2 w-full rounded mb-4" />
    <button id="getWeatherBtn" class="bg-blue-500 text-white px-4 py-2 rounded">Get Weather</button>

    <div id="weatherResult" class="mt-4 text-gray-700"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
